# Stage 2: compose the three-tier stack.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: festpass
      POSTGRES_USER: festpass
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - festpass-data:/var/lib/postgresql/data
    networks:
      - backend-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: dockskyadav/ca2-docker-assesment:1.0.0
    environment:
      REGNO: "202401100100254"
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-backend
      - backend-db

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "134:80"
    depends_on:
      - backend
    networks:
      - frontend-backend
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  festpass-data:

networks:
  frontend-backend:
  backend-db:

# Stage 4: publish the versioned registry image.
